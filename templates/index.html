<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Programa de Soma</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      function validateNumberInput(event) {
        const char = String.fromCharCode(event.which);
        if (!/[0-9,]/.test(char)) {
          event.preventDefault();
        }
      }

      function enviarFormulario(event) {
        event.preventDefault(); // Previne o comportamento padrão do formulário
        const valor1 = document.getElementById("valor1").value;
        const valor2 = document.getElementById("valor2").value;

        fetch("/calcular", {
          // Verifique se a URL é '/calcular'
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ valor1: valor1, valor2: valor2 }),
        })
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("resultado").innerText =
              "Resultado: " + data.resultado;
          })
          .catch((error) => {
            console.error("Erro:", error);
          });
      }

      function limparFormulario() {
        document.getElementById("valor1").value = "";
        document.getElementById("valor2").value = "";
        document.getElementById("resultado").innerText = "";
      }
    </script>
  </head>
  <body class="bg-light">
    <div class="container" style="max-width: 500px; margin-top: 50px">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="card-title text-center">Programa de Soma</h1>
          <form id="formulario" onsubmit="enviarFormulario(event)">
            <div class="mb-3">
              <label for="valor1" class="form-label">Valor 1:</label>
              <input
                type="text"
                class="form-control"
                id="valor1"
                name="valor1"
                placeholder="Digite um número"
                required
                onkeypress="validateNumberInput(event)"
              />
            </div>
            <div class="mb-3">
              <label for="valor2" class="form-label">Valor 2:</label>
              <input
                type="text"
                class="form-control"
                id="valor2"
                name="valor2"
                placeholder="Digite outro número"
                required
                onkeypress="validateNumberInput(event)"
              />
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Somar</button>
              <button
                type="button"
                class="btn btn-secondary"
                onclick="limparFormulario()"
              >
                Limpar
              </button>
            </div>
          </form>
          <h2 id="resultado" class="mt-4 text-center">Resultado:</h2>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
  </body>
</html>
